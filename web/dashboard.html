<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareCircle · Family Dashboard</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e5e8f0;--text:#18202f;--muted:#6b7488;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--okbg:#e9f8ef;--badbg:#fdecec;--warnbg:#fff6e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px}h1 span{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:900px){.c4,.c5,.c7,.c8{grid-column:span 12}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
.big{font-size:34px;font-weight:700}.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.taken{background:var(--okbg);color:var(--ok)}.missed,.skipped{background:var(--badbg);color:var(--bad)}.due{background:var(--warnbg);color:var(--warn)}.upcoming{background:#eef2ff;color:#4f46e5}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.lv-urgent{background:var(--badbg);border-color:#f5b5b5}.lv-alert{background:var(--warnbg);border-color:#f6d49a}.lv-info{background:#f2f5fb}
.alert .meta{font-size:12px;color:var(--muted);margin-top:4px}.alert ul{margin:6px 0 0 18px;padding:0;font-size:12px;color:var(--muted)}
.summary{white-space:pre-wrap}.summary b{display:inline}
.timeline .row{align-items:flex-start;gap:10px}.mood{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.flash{animation:flash 1.5s 2}@keyframes flash{50%{box-shadow:0 0 0 4px #fca5a5}}
</style>
</head>
<body>
<header><div><h1 id="title">CareCircle<span id="sub"></span></h1></div>
<div class="btns"><button onclick="riskCheck()">Run risk check</button><button onclick="genSummary()" class="primary">Generate weekly summary</button>
<label><button onclick="document.getElementById('rx').click()">📷 Import prescription</button><input type="file" id="rx" accept="image/*" hidden></label>
<button onclick="resetDemo()" title="Reset demo data">↺</button></div></header>
<main>
  <section class="card c4"><h2>7-day adherence</h2><div class="big" id="rate">–</div><div class="muted" id="rateSub"></div><div id="bars" style="margin-top:12px"></div></section>
  <section class="card c8"><h2>Alerts</h2><div id="alerts" class="muted">No alerts this week.</div></section>
  <section class="card c5"><h2>Today's medications</h2><div id="today"></div></section>
  <section class="card c7 timeline"><h2>How she's been feeling</h2><div id="wb"></div></section>
  <section class="card c7"><h2>AI weekly summary <span class="muted" id="sumMeta" style="text-transform:none;letter-spacing:0"></span></h2><div class="summary" id="summary"><span class="muted">Click “Generate weekly summary”.</span></div></section>
  <section class="card c5"><h2>Upcoming appointments</h2><div id="appts"></div><h2 style="margin-top:18px">Medication schedule</h2><div id="meds"></div><div id="rxOut" class="muted" style="margin-top:8px"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let lastAlert=null;
const esc=s=>(s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=iso=>new Date(iso).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const hm=s=>{const[h,m]=s.split(':').map(Number);return `${h%12||12}${m?':'+String(m).padStart(2,'0'):''} ${h>=12?'PM':'AM'}`};
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const moodColor=m=>m>=4?['#e9f8ef','#16a34a']:m==3?['#fff6e6','#d97706']:['#fdecec','#dc2626'];
async function load(){const s=await (await fetch('/api/state')).json();
  $('sub').textContent=`· ${s.profile.name}, ${s.profile.age||''} · lives ${s.profile.lives||''} · AI: ${s.llm}`;
  const a=s.adherence_7d;$('rate').textContent=a.rate==null?'–':Math.round(a.rate*100)+'%';$('rateSub').textContent=`${a.taken} of ${a.scheduled} doses taken · ${a.missed.length} missed`;
  const max=Math.max(...s.days.map(d=>d.taken+d.missed+d.open),1);
  $('bars').innerHTML=`<svg viewBox="0 0 280 110" width="100%" style="max-height:160px">${s.days.map((d,i)=>{const x=i*40+8,h1=d.taken/max*80,h2=d.missed/max*80,h3=d.open/max*80;
    return `<rect x="${x}" y="${90-h1}" width="24" height="${h1}" rx="3" fill="#16a34a"/><rect x="${x}" y="${90-h1-h2}" width="24" height="${h2}" rx="3" fill="#dc2626"/><rect x="${x}" y="${90-h1-h2-h3}" width="24" height="${h3}" rx="3" fill="#c7d2fe"/><text x="${x+12}" y="106" font-size="10" text-anchor="middle" fill="#6b7488">${new Date(d.date+'T12:00').toLocaleDateString([], {weekday:'short'})}</text>`}).join('')}</svg>
   <div class="muted" style="font-size:12px">■ <span style="color:#16a34a">taken</span> ■ <span style="color:#dc2626">missed</span> ■ <span style="color:#818cf8">to come</span></div>`;
  $('today').innerHTML=s.today.map(d=>`<div class="row"><div><b>${esc(d.medication)}</b> <span class="muted">${esc(d.dose)} · ${hm(d.slot)}</span></div><span class="pill ${d.status}">${d.status}</span></div>`).join('')||'<span class="muted">No medications.</span>';
  $('alerts').innerHTML=s.alerts.length?s.alerts.slice(0,6).map(x=>`<div class="alert lv-${x.level}"><b>${x.level.toUpperCase()}</b> · ${esc(x.message)}<div class="meta">${fmt(x.ts)} · ${esc(x.source)}${(x.delivered||[]).length?' · sent via '+x.delivered.join(', '):' · dashboard'}${x.reason?' · '+esc(x.reason):''}</div>${(x.evidence||[]).length?'<ul>'+x.evidence.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>':''}</div>`).join(''):'<span class="muted">No alerts this week.</span>';
  if(s.alerts[0]&&lastAlert&&s.alerts[0].id!==lastAlert){$('alerts').parentElement.classList.remove('flash');void $('alerts').offsetWidth;$('alerts').parentElement.classList.add('flash')}
  lastAlert=s.alerts[0]?.id||lastAlert||'none';
  $('wb').innerHTML=s.wellbeing.map(w=>{const[bg,fg]=moodColor(w.mood||3);return `<div class="row"><div class="mood" style="background:${bg};color:${fg}">${w.mood??'?'}</div><div style="flex:1">“${esc(w.note)}”<div class="muted" style="font-size:12px">${fmt(w.ts)}${w.symptoms?.length?' · '+w.symptoms.join(', '):''}</div></div>${w.red_flags?.length?'<span class="pill missed">red flag</span>':''}</div>`}).join('')||'<span class="muted">No check-ins yet.</span>';
  $('appts').innerHTML=s.appointments.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.location)}</div></div><span class="muted">${fmt(x.when)}</span></div>`).join('')||'<span class="muted">None scheduled.</span>';
  $('meds').innerHTML=s.meds.map(m=>`<div class="row"><div><b>${esc(m.name)}</b> <span class="muted">${esc(m.dose)}${m.purpose?' · '+esc(m.purpose):''}</span></div><span class="muted">${m.times.map(hm).join(', ')}${m.source==='prescription-photo'?' 📷':''}</span></div>`).join('');
  if(s.summary){$('summary').innerHTML=md(s.summary.text);$('sumMeta').textContent=`· ${s.summary.generated_by} · ${fmt(s.summary.ts)}`}
}
async function riskCheck(){const r=await (await fetch('/api/risk-check',{method:'POST'})).json();alert(`Risk level: ${r.level}\nDecided by: ${r.decision.decided_by}\n${r.decision.reasoning||''}${r.decision.suppressed?'\n('+r.decision.suppressed+')':''}`);load()}
async function genSummary(){$('summary').innerHTML='<span class="muted">Writing summary with Amazon Bedrock…</span>';await fetch('/api/summary',{method:'POST'});load()}
async function resetDemo(){if(confirm('Reset demo data?')){await fetch('/api/reset-demo',{method:'POST'});lastAlert=null;load()}}
$('rx').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('rxOut').textContent='Reading prescription with Bedrock vision…';
  const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
  const r=await (await fetch('/api/prescription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_base64:b64,media_type:f.type})})).json();
  $('rxOut').innerHTML=r.error?`<span style="color:var(--bad)">${esc(r.error)}</span>`:`Added: ${r.added.map(m=>esc(m.name)+' ('+m.times.join(', ')+')').join('; ')||'nothing'}${r.needs_review.length?'<br>⚠ Check: '+r.needs_review.map(esc).join('; '):''}`;e.target.value='';load()};
load();setInterval(load,4000);
</script>
</body>
</html>
